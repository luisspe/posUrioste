{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia sesión | Acuática Urioste</title>
    <link rel="shortcut icon" href="{% static 'posApp/assets/material-admin/images/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'posAPP/assets/default/css/urioste.css' %}?v=20261014n">
    <script src="{% static 'posAPP/assets/default/js/jquery-3.6.0.min.js' %}"></script>
</head>
<body class="u-login">
    <section class="u-login__foto" style="--foto: url('{% static 'posAPP/assets/default/img/alberca-urioste.webp' %}')">
        <div class="u-login__frase">
            <p class="u-login__marca">Acuática Urioste</p>
            <p class="u-login__lema">El equipo te espera, sé parte de la familia.</p>
        </div>
    </section>

    <main class="u-login__panel">
        <div class="u-login__caja">
            <img class="u-login__logo" src="https://static.wixstatic.com/media/7dbb81_b3104a39f3ed47ae8c62b057b5437929~mv2.png/v1/fill/w_411,h_411,al_c,q_85,usm_0.66_1.00_0.01,enc_auto/313400177_487585436739361_7975272688749260606_n.png" alt="Acuática Urioste">
            <h1 class="u-login__titulo">Inicia sesión</h1>
            <p class="u-login__texto">Entra con tu usuario de recepción o de gerencia.</p>

            <form id="login-user" method="POST" action="{% url 'login-user' %}" novalidate>
                {% csrf_token %}
                <div class="u-login__error" id="login-error" role="alert" hidden></div>
                <label class="u-login__campo">
                    <span>Usuario</span>
                    <span class="u-login__input">
                        <span class="material-symbols-rounded" aria-hidden="true">person</span>
                        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                    </span>
                </label>
                <label class="u-login__campo">
                    <span>Contraseña</span>
                    <span class="u-login__input">
                        <span class="material-symbols-rounded" aria-hidden="true">lock</span>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button type="button" class="u-login__ver" id="ver-password" aria-label="Mostrar contraseña" aria-pressed="false">
                            <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                        </button>
                    </span>
                </label>
                <button type="submit" class="u-login__entrar" id="entrar">
                    <span class="u-login__entrar-texto">Entrar</span>
                </button>
            </form>
        </div>
    </main>

    <script>
        $(function () {
            var $form = $('#login-user'), $error = $('#login-error'), $boton = $('#entrar');

            $('#ver-password').on('click', function () {
                var $pass = $('#password'), visible = $pass.attr('type') === 'text';
                $pass.attr('type', visible ? 'password' : 'text');
                $(this).attr({'aria-pressed': String(!visible), 'aria-label': visible ? 'Mostrar contraseña' : 'Ocultar contraseña'})
                       .find('.material-symbols-rounded').text(visible ? 'visibility' : 'visibility_off');
            });

            function mostrarError(texto) {
                $error.text(texto).prop('hidden', false);
                $boton.prop('disabled', false).removeClass('is-cargando');
            }

            $form.on('submit', function (e) {
                e.preventDefault();
                if (!$('#username').val().trim() || !$('#password').val()) {
                    return mostrarError('Escribe tu usuario y tu contraseña.');
                }
                $error.prop('hidden', true);
                $boton.prop('disabled', true).addClass('is-cargando');
                $.ajax({
                    headers: {"X-CSRFToken": '{{ csrf_token }}'},
                    url: "{% url 'login-user' %}",
                    data: new FormData(this),
                    cache: false,
                    contentType: false,
                    processData: false,
                    method: 'POST',
                    dataType: 'json',
                    error: function () { mostrarError('No se pudo conectar. Revisa el internet e inténtalo otra vez.'); },
                    success: function (resp) {
                        if (resp && resp.status === 'success' && resp.redirect_url) {
                            location.href = resp.redirect_url;
                        } else {
                            mostrarError((resp && resp.msg) || 'No se pudo iniciar sesión.');
                            $('#password').val('').trigger('focus');
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
