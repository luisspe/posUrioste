{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No se pudo abrir | Acuática Urioste</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'posAPP/assets/default/css/urioste.css' %}?v=20261014p">
</head>
<body class="u-error">
    <main class="u-panel u-error__caja">
        <span class="material-symbols-rounded u-error__icono" aria-hidden="true">error</span>
        <h1 class="u-title">No se pudo abrir esta página</h1>
        <p class="u-error__mensaje">{{ message|default:"Ocurrió un problema inesperado." }}</p>
        <div class="u-error__acciones">
            <a class="u-btn u-btn--primary" href="{% url 'home-page' %}">Ir al inicio</a>
            <a class="u-btn u-btn--ghost" href="javascript:history.back()">Regresar</a>
            {% if user.is_authenticated %}<a class="u-btn u-btn--ghost" href="{% url 'logout' %}">Cerrar sesión</a>{% endif %}
        </div>
    </main>
</body>
</html>
